[package]
name = "phrasegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Arc <attobop@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/phrasegen"
homepage = "https://github.com/arclabs561/phrasegen"
documentation = "https://docs.rs/phrasegen"
description = "Learn typing-timing models and generate/score fast-to-type passphrases"
publish = false

[[bin]]
name = "phrasegen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = "2.10"
unicode-normalization = "0.1"
unicode-segmentation = "1.11"
zip = "2"
crossterm = "0.28"
rand_regex = "0.17"
rand08 = { package = "rand", version = "0.8" }
libm = "0.2"
flate2 = "1.1"
tar = "0.4"
pare = "0.1.0"

[dev-dependencies]
proptest = "1.9"
tempfile = "3.24"
